name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            target: --target universal-apple-darwin
          - platform: windows
            runner: windows-latest
            target: ""
          - platform: linux
            runner: ubuntu-22.04
            target: ""
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          awk -v ver="$VERSION" 'f && /^version = /{sub(/"[^"]*"/, "\"" ver "\""); f=0} /^name = "app"$/{f=1} 1' src-tauri/Cargo.lock > Cargo.lock.tmp
          mv Cargo.lock.tmp src-tauri/Cargo.lock

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: yarn install --immutable

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          cert_id="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          if [ -z "$cert_id" ]; then
            echo "No 'Developer ID Application' identity found in the imported certificate" >&2
            exit 1
          fi
          echo "CERT_ID=$cert_id" >> "$GITHUB_ENV"

      - name: Build bundles
        shell: bash
        env:
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.platform }}" = "macos" ] && [ "$HAS_APPLE_CERT" = "true" ]; then
            export APPLE_SIGNING_IDENTITY="$CERT_ID"
            if [ -n "$SECRET_APPLE_ID" ]; then
              export APPLE_ID="$SECRET_APPLE_ID"
              export APPLE_PASSWORD="$SECRET_APPLE_PASSWORD"
              export APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
            fi
          fi
          yarn tauri build ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          case "${{ matrix.platform }}" in
            macos)
              cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
                "dist-artifacts/Chronotile_${VERSION}_macos_universal.dmg"
              ;;
            windows)
              cp src-tauri/target/release/bundle/nsis/*-setup.exe \
                "dist-artifacts/Chronotile_${VERSION}_windows_x64-setup.exe"
              cp src-tauri/target/release/bundle/msi/*.msi \
                "dist-artifacts/Chronotile_${VERSION}_windows_x64.msi"
              ;;
            linux)
              cp src-tauri/target/release/bundle/deb/*.deb \
                "dist-artifacts/Chronotile_${VERSION}_linux_amd64.deb"
              cp src-tauri/target/release/bundle/rpm/*.rpm \
                "dist-artifacts/Chronotile_${VERSION}_linux_x86_64.rpm"
              cp src-tauri/target/release/bundle/appimage/*.AppImage \
                "dist-artifacts/Chronotile_${VERSION}_linux_x86_64.AppImage"
              ;;
          esac
          ls -la dist-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: dist-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
            gh release upload "${GITHUB_REF_NAME}" dist-artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Chronotile ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              dist-artifacts/*
          fi

  sync:
    name: Sync version and changelog
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          awk -v ver="$VERSION" 'f && /^version = /{sub(/"[^"]*"/, "\"" ver "\""); f=0} /^name = "app"$/{f=1} 1' src-tauri/Cargo.lock > Cargo.lock.tmp
          mv Cargo.lock.tmp src-tauri/Cargo.lock

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -o CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and push
        run: |
          git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bump: release ${GITHUB_REF_NAME}"
          git push origin HEAD:main
